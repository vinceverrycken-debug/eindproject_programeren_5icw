{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Game toevoegen</h2>
    <form method="POST">
        <label>Titel *</label>
        <select name="title" id="titleSelect" required>
            <option value="">-- Kies een game --</option>
            {% for game in alle_games %}
                <option value="{{ game['name'] }}">{{ game['name'] }}</option>
            {% endfor %}
        </select>

        <label>Genre</label>
        <select name="genre" id="genreSelect">
            <option value="">-- Kies eerst een game --</option>
        </select>

        <label>Platform</label>
        <select name="platform">
            <option value="PS5">PS5</option>
            <option value="PS4">PS4</option>
            <option value="PC">PC</option>
            <option value="switch">Switch</option>
            <option value="XBOX">XBOX</option>
            <option value="mobile">Mobile</option>
        </select>

        <label>Status</label>
        <select name="status">
            <option value="wil spelen">Wil spelen</option>
            <option value="bezig">Bezig</option>
            <option value="gespeeld">Gespeeld</option>
        </select>

        <label>Jouw rating</label>
        <select name="user_rating">
            <option value="">-- Geen rating --</option>
            {% for i in range(1, 6) %}
            <option value="{{ i }}">{{ i }}</option>
            {% endfor %}
        </select>

        <button type="submit">Toevoegen</button>
        <a href="{{ url_for('index') }}">Annuleren</a>
    </form>
</div>

<script>
    const titleSelect = document.getElementById("titleSelect");
    const genreSelect = document.getElementById("genreSelect");

    titleSelect.addEventListener("change", async () => {
        const name = titleSelect.value;
        genreSelect.innerHTML = '<option value="">Laden...</option>';

        if (!name) {
            genreSelect.innerHTML = '<option value="">-- Kies eerst een game --</option>';
            return;
        }

        const res = await fetch(`/get_genres?name=${encodeURIComponent(name)}`);
        const genres = await res.json();

        if (genres.length === 0) {
            genreSelect.innerHTML = '<option value="">Geen genre gevonden</option>';
        } else {
            genreSelect.innerHTML = genres.map(g =>
                `<option value="${g}">${g}</option>`
            ).join("");
        }
    });
</script>
{% endblock %}
